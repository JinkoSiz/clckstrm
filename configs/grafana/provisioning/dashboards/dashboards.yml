# Grafana dashboards provisioning

apiVersion: 1

providers:
  - name: 'Clickstream Dashboards'
    orgId: 1
    folder: 'Clickstream'
    folderUid: 'clickstream'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
